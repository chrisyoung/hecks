[package]
name = "storehouse-postgres"
version = "0.1.0"
edition = "2021"
description = "Postgres persistence adapter for storehouse — implements the PersistenceAdapter port and, alone among adapters, the lineage capability. Host-only; never linked by the wasm Worker."

[lib]
path = "src/lib.rs"

# NO `[features]` — this crate's production code needs no parser at all.
# It used to (a legacy-row backfill, a cosmetic-vs-real tamper-diagnosis
# message), gated behind a `parser` feature ; both call sites are gone now
# (see lib.rs's own comment on why), so there is nothing left to gate.
#
# default-features = false : an adapter implements a port, not a domain,
# and feature unification across the workspace would otherwise force
# every projected domain back in regardless of what the CLI binary itself
# asked for.
[dependencies]
storehouse = { path = "..", default-features = false }
postgres = "0.19"
serde_json = "1"

# native-tls/postgres-native-tls — a managed Postgres service (RDS, Cloud
# SQL, Azure, Supabase, Neon, ...) commonly requires TLS ; the OS's own TLS
# stack (Secure Transport/SChannel/OpenSSL, whichever native-tls picks per
# platform) avoids a separate OpenSSL build/link story. Negotiated per
# tokio-postgres's own `sslmode` handling (default `prefer`): a local dev
# Postgres with no TLS configured at all still connects exactly as it did
# under NoTls, and a deployment whose connection string says `sslmode=
# require` gets it enforced — the same connector either way, not a
# separate code path per environment.
native-tls = "0.2"
postgres-native-tls = "0.5"

# The integration tests still want a REAL shape, built from real bluebook
# text, to compare era_gate's own behavior against — `storehouse::parser::
# parse` + `storehouse::runtime::storage_shape::project`, inlined in the
# test itself now that this crate's own `shape_of` is gone. A dev-only
# feature bump: the LIBRARY still needs no parser, only its tests do.
[dev-dependencies]
storehouse = { path = "..", features = ["parser"] }
