[package]
name = "storehouse-postgres"
version = "0.1.0"
edition = "2021"
description = "Postgres persistence adapter for storehouse — implements the PersistenceAdapter port and, alone among adapters, the lineage capability. Host-only; never linked by the wasm Worker."

[lib]
path = "src/lib.rs"

# default-features = false : same reasoning as storehouse-sqlite's own
# dependency line — an adapter implements a port, not a domain, and feature
# unification across the workspace would otherwise force every projected
# domain back in regardless of what the CLI binary itself asked for.
[dependencies]
storehouse = { path = "..", default-features = false }
postgres = "0.19"
serde_json = "1"
