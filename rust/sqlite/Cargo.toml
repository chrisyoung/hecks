[package]
name = "storehouse-sqlite"
version = "0.1.0"
edition = "2021"
description = "SQLite persistence adapter for storehouse — implements the PersistenceAdapter port. Host-only (rusqlite); never linked by the wasm Worker."

[lib]
path = "src/lib.rs"

# default-features = false : an adapter never needs a domain compiled in to
# implement a PORT, and Cargo unifies a path dependency's features across
# every crate that names it in one build — left default, this adapter alone
# would force every projected domain back into a "deployment binary with
# just banking in it", silently.
[dependencies]
storehouse = { path = "..", default-features = false }
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde_json = "1"
