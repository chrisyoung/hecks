# The PACKAGE is named `storehouse`, matching Hecks exactly. Cargo resolves
# path dependencies by package name, so `storehouse = { path = ".." }` in the
# cherry-picked sqlite crate only resolves if this package carries that name.
# The alternative was editing that crate's Cargo.toml, which is the first edit,
# and the first edit is how a cherry-pick becomes a fork.
#
# This package is a LIBRARY ONLY. It must not depend on storehouse-sqlite: the
# adapter depends on the port, never the other way round, and Cargo enforces it
# as a dependency cycle if you get it backwards. The binary lives in cli/, which
# links both — the same shape Hecks uses (members = ["sqlite", "cli"]).
[package]
name = "storehouse"
version = "0.1.0"
edition = "2021"

[lib]
name = "storehouse"
path = "src/lib.rs"

# ONE FEATURE PER PROJECTED DOMAIN — which of `projected/registry.rs`'s
# always-declared entries actually compile in, per build. `default` carries
# every one, so a plain `cargo build`/`cargo test` (no flags) links exactly
# what it always has. A deployment wanting only Banking builds with
# `--no-default-features --features banking` instead — the registry file
# itself never changes shape; `#[cfg(feature = "...")]` inside it does the
# selecting. Names match each projected/*.rs file's own stem
# (`bin/ir_rust_registry`'s own naming), not the chapter's declared name.
[features]
default = ["banking", "expression", "pizzas", "reflex", "till_room", "wire"]
banking = []
expression = []
pizzas = []
reflex = []
till_room = []
wire = []

[dependencies]
serde_json = "1"

# serde's own derive — era_guard.rs holds its snapshot of a past boot's
# shape as JSON now (not raw text, re-parsed), so `ir::Domain`'s own graph
# needs to round-trip through serde directly, not just through
# `serde_json::Value` the way `ir_json.rs`'s hand-tuned wire format already
# does.
serde = { version = "1", features = ["derive"] }

# regex — a declared `pattern:` has to be MATCHED, not just parsed, and this is
# the engine pattern_subset was written against : every construct it refuses is
# refused because THIS crate and Ruby's Onigmo would disagree about it. The
# subset is only half the story, though — see pattern_subset::matches for the
# builder flags that align the two engines on the constructs it admits.
regex = "1"

# flate2 — heki compresses its store. Same version Hecks pins, so a store
# written by one runtime is readable by the other.
flate2 = "1"

# sha2 — raw-byte INTEGRITY digests over held era texts, verified at
# boot. Deliberately NOT era naming: era identity hashes the canonical
# projection and is minted once, Ruby-side only; this is a plain
# tamper check over bytes, implementation-trivial in any runtime.
sha2 = "0.10"

[workspace]
members = ["sqlite", "postgres", "cli"]
