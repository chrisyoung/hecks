# ONE FEATURE PER GENERATED DOMAIN — selects which domain's own
# generated::<domain>::merged module `generated::active` re-exports
# (rust/src/generated/mod.rs). Kept in sync by bin/project_rust: a
# feature is added here whenever a new domain is generated, never
# removed (the domain's own generated/<name>/ directory is the
# source of truth for whether it still exists). `default` tracks
# whichever domain was generated MOST RECENTLY, so a bare
# `cargo build`/`cargo test` keeps behaving exactly as it always
# has; any other still-generated domain stays reachable via
# `--no-default-features --features <name>`.
[features]
default = ["banking"]
compliance = []
meta = []
pizzas = []
embryonaut = []
banking = []

[package]
name = "rust"
version = "0.1.0"
edition = "2021"

# PRD 09 — `.match?` (Resolver::MatchesRegex) needs real regex
# evaluation to be admitted honestly rather than refused the way
# `.split`/`.first`/`.last` are (see expression_operators/string.rs's
# and accessor.rs's own headers for why THOSE stay refused instead).
# `regex = "1"` is not a new dependency to this WORKSPACE — rust/host's
# own Cargo.toml already pins the identical version elsewhere — only new
# to this crate specifically, which had none before this line. Flagged
# here rather than added silently: this crate's own zero-dependency
# history up to this point may have been a deliberate choice, not an
# accident, and this is the one place PRD 09 makes a real judgment call
# rather than a mechanical one.
[dependencies]
regex = "1"

[lib]
name = "rust"
path = "src/lib.rs"

[[bin]]
name = "rust"
path = "src/main.rs"
