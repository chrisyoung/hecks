[package]
name = "hecksagain"
version = "0.1.0"
edition = "2021"

# serde_json only. The Rust side reads an IR that Ruby produced and evaluates
# it ; it never parses a bluebook, so it needs no parser and no DSL machinery.
[dependencies]
serde_json = "1"

# rusqlite — so the Rust runtime actually CALLS the adapter the hecksagon
# binds, instead of keeping state in a HashMap and only pretending to. Bundled
# so the build needs no system sqlite and the two runtimes cannot end up on
# different library versions.
rusqlite = { version = "0.32", features = ["bundled"] }

[[bin]]
name = "hecksagain"
path = "src/main.rs"
