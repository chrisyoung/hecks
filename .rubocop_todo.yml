# spec/router_spec.rb's own `ensure Object.send(:remove_const, :Realm) ...`
# blocks (9 of them) don't fit `stub_const`'s actual mechanism: stub_const
# pre-declares a replacement for a constant that already exists BEFORE the
# example runs and auto-restores after; every one of these constants (Realm,
# SugarRealm, OptionsRealm, ...) is a top-level module/class the example
# itself creates fresh via `described_class.boot` — there's nothing to stub
# a replacement for, and no "original value" to restore. Plain teardown of a
# test-created constant, not a fit for the cop's target pattern.
RSpec/RemoveConst:
  Exclude:
    - 'spec/router_spec.rb'

