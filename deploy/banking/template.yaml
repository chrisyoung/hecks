# GENERATED by bin/project_deploy examples/banking — re-run it to refresh
# this file rather than hand-editing. Source: examples/banking/bluebook/banking.world's own
# deployed_to("AwsLambda") block.
#
# SELF-CONTAINED, ON PURPOSE — this stack owns its own private VPC,
# subnets, security groups, and RDS Postgres instance, not just the
# Lambda. No externally-supplied VPC/database parameters, no
# DatabaseUrl secret anyone has to type: RDS's own
# ManageMasterUserPassword generates and stores the password in
# Secrets Manager, and DATABASE_URL is composed from it via a
# CloudFormation dynamic reference — resolved at deploy time, never
# visible in this template, a parameter, or any tool's output.
#
# NO NAT GATEWAY — deliberately. These subnets have no route to the
# internet at all, only to the RDS instance inside the same VPC. That's
# the whole job today (dispatch a command, read/write the journal);
# CloudWatch Logs delivery doesn't go through the function's own VPC
# networking, so it needs no route either. Real outbound internet
# access from here (a future external API call, say) would need a NAT
# Gateway added — a real, ongoing cost this template doesn't take on
# until something actually needs it.
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  banking — dispatched through hecksagain's rust/host, a
  wasmtime-sandboxed Rust binary with a rehydrate-and-replay Postgres
  journal (docs/decisions/0018), backed by its own private RDS
  Postgres instance. PackageType Zip, no container.

Resources:
  BankingDbVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true

  BankingDbSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref BankingDbVpc
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']

  BankingDbSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref BankingDbVpc
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']

  BankingDbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub "${AWS::StackName} - private subnets for banking's own RDS instance"
      SubnetIds: [!Ref BankingDbSubnetA, !Ref BankingDbSubnetB]

  # NO INLINE SecurityGroupEgress/Ingress ON EITHER GROUP — each would
  # need to reference the other's id from inside its own Properties,
  # a genuine circular create-order dependency CloudFormation refuses
  # outright (cfn-lint E3004). Standard fix: create both groups
  # empty, then wire the cross-reference through two standalone rule
  # resources below, each of which can legitimately depend on both
  # groups already existing.
  BankingFunctionSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref BankingDbVpc
      GroupDescription: BankingFunction - no inbound (Lambda receives no traffic via its VPC ENI), egress rule attached separately below

  BankingDbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref BankingDbVpc
      GroupDescription: BankingDb - ingress rule attached separately below, from BankingFunction only

  BankingFunctionEgressToDb:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref BankingFunctionSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      DestinationSecurityGroupId: !Ref BankingDbSecurityGroup

  BankingDbIngressFromFunction:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref BankingDbSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref BankingFunctionSecurityGroup

  BankingDb:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: postgres
      EngineVersion: "16.14"
      DBInstanceClass: db.t4g.micro
      AllocatedStorage: "20"
      StorageEncrypted: true
      DBName: banking
      MasterUsername: postgres
      ManageMasterUserPassword: true
      PubliclyAccessible: false
      DBSubnetGroupName: !Ref BankingDbSubnetGroup
      VPCSecurityGroups: [!Ref BankingDbSecurityGroup]

  BankingFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      # PINNED, not SAM's own auto-suffixed default — a Ruby-side
      # LambdaClient needs to know this function's name AHEAD OF a
      # first deploy (there's no chicken-egg lookup step), the same
      # "configured for me, in the projection" standard every other
      # piece of generated deploy config already holds to. Matches
      # `stack_name` above exactly — one name, two places it's read
      # from, never out of sync since both derive from `domain_name`.
      FunctionName: hecksagain-banking
      PackageType: Zip
      Runtime: provided.al2023
      Architectures: [arm64]
      Handler: bootstrap
      MemorySize: 512
      Timeout: 10
      Environment:
        Variables:
          # {{resolve:secretsmanager:...}} is a CloudFormation dynamic
          # reference — resolved by the platform at deploy time, never
          # rendered into the template, this tool's output, or any
          # CloudTrail/console view of the function's own config as
          # plaintext outside AWS's own encrypted handling.
          DATABASE_URL: !Sub
            - "postgres://postgres:${DbPass}@${DbHost}:5432/banking"
            - DbPass: !Sub "{{resolve:secretsmanager:${BankingDb.MasterUserSecret.SecretArn}:SecretString:password}}"
              DbHost: !GetAtt BankingDb.Endpoint.Address
          HECKS_WASM_PATH: !Sub "/var/task/banking.wasm"
          # STATIC, not a deploy-time parameter — HECKS_DOMAIN is this
          # domain's own declared name, known at generation time the
          # same way DBName/HECKS_WASM_PATH already are. HECKS_ERA is
          # "1" because that's what a FRESH database always gets:
          # Postgres::LineageManager::EraResolver#check! mints era 1
          # unconditionally the first time any Ruby process boots
          # against an empty `hecks_eras` (era_resolver.rb's own
          # `held.empty?` branch) — deterministic, not guessed. `make
          # mint-era` (this directory's own Makefile) is what actually
          # triggers that first boot; a LATER real schema evolution
          # (era 2+) is a separate, later re-generation, not this one.
          HECKS_DOMAIN: Banking
          HECKS_ERA: "1"
      VpcConfig:
        SubnetIds: [!Ref BankingDbSubnetA, !Ref BankingDbSubnetB]
        SecurityGroupIds: [!Ref BankingFunctionSecurityGroup]
      # AWS_IAM, not NONE — this dispatches real domain commands
      # (cap-table/governance-shaped data, for Embryonaut's own use);
      # an unauthenticated public URL is the wrong default for that,
      # even though it's the simpler one to demo with.
      FunctionUrlConfig:
        AuthType: AWS_IAM

Outputs:
  FunctionUrl:
    Value: !GetAtt BankingFunctionUrl.FunctionUrl
  # STACK_OUTPUTS (bin/project_deploy, above the heredocs) is the ONE
  # place these four names live — DatabaseEndpoint/DatabaseSecretArn
  # feed `make mint-era`'s own boot step directly; VpcId/
  # DbSecurityGroupId ALSO feed bastion.yaml's own Parameters (a
  # separate, sibling stack, created only for the few minutes a mint
  # takes and destroyed right after, attaching into the SAME private
  # network without this main template ever knowing a bastion
  # exists) and the Makefile's own --parameter-overrides. Rename a
  # key in that table and every consumer follows; reference one that
  # doesn't exist there and bin/project_deploy refuses before
  # writing a single file, instead of a bastion.yaml whose Parameter
  # nothing could ever fill. (`PrivateSubnetId` used to sit here too
  # — dropped, nothing ever consumed it; bastion.yaml mints its own
  # subnet instead.)
  VpcId:
    Value: !Ref BankingDbVpc
  DbSecurityGroupId:
    Value: !Ref BankingDbSecurityGroup
  DatabaseEndpoint:
    Value: !GetAtt BankingDb.Endpoint.Address
  DatabaseSecretArn:
    Value: !GetAtt BankingDb.MasterUserSecret.SecretArn
