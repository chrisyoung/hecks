  # doesn't exist there and bin/project_deploy refuses before
  # writing a single file, instead of a bastion.yaml whose Parameter
  # nothing could ever fill. (`PrivateSubnetId` used to sit here too
  # — dropped, nothing ever consumed it; bastion.yaml mints its own
  # subnet instead.)
  VpcId:
    Value: !Ref EmbryonautDbVpc
  DbSecurityGroupId:
    Value: !Ref EmbryonautDbSecurityGroup
  DatabaseEndpoint:
    Value: !GetAtt EmbryonautDb.Endpoint.Address
  DatabaseSecretArn:
    Value: !GetAtt EmbryonautDb.MasterUserSecret.SecretArn
  FunctionSecurityGroupId:
    Value: !Ref EmbryonautFunctionSecurityGroup
  PrivateSubnetAId:
    Value: !Ref EmbryonautDbSubnetA
  PrivateSubnetBId:
    Value: !Ref EmbryonautDbSubnetB
  PublicSubnetId:
    Value: !Ref EmbryonautDbPublicSubnet
  BastionSubnetId:
    Value: !Ref EmbryonautDbBastionPublicSubnet
