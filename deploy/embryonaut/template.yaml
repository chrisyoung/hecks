# GENERATED by bin/project_deploy /Users/christopheryoung/Projects/embryonaut — re-run it to refresh
# this file rather than hand-editing. Source: /Users/christopheryoung/Projects/embryonaut/bluebook/embryonaut.world's own
# deployed_to("AwsLambda") block.
#
# SELF-CONTAINED, ON PURPOSE — this stack owns its own private VPC,
# subnets, security groups, and RDS Postgres instance, not just the
# Lambda. No externally-supplied VPC/database parameters, no
# DatabaseUrl secret anyone has to type: RDS's own
# ManageMasterUserPassword generates and stores the password in
# Secrets Manager, and DATABASE_URL is composed from it via a
# CloudFormation dynamic reference — resolved at deploy time, never
# visible in this template, a parameter, or any tool's output.
#
# NO NAT GATEWAY — deliberately. These subnets have no route to the
# internet at all, only to the RDS instance inside the same VPC. That's
# the whole job today (dispatch a command, read/write the journal);
# CloudWatch Logs delivery doesn't go through the function's own VPC
# networking, so it needs no route either. Real outbound internet
# access from here (a future external API call, say) would need a NAT
# Gateway added — a real, ongoing cost this template doesn't take on
# until something actually needs it.
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  embryonaut — dispatched through hecksagain's rust/host, a
  wasmtime-sandboxed Rust binary with a rehydrate-and-replay Postgres
  journal (docs/decisions/0018), backed by its own private RDS
  Postgres instance. PackageType Zip, no container.

Resources:
  EmbryonautDbVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true

  EmbryonautDbSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref EmbryonautDbVpc
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']

  EmbryonautDbSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref EmbryonautDbVpc
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']

  EmbryonautDbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub "${AWS::StackName} - private subnets for embryonaut's own RDS instance"
      SubnetIds: [!Ref EmbryonautDbSubnetA, !Ref EmbryonautDbSubnetB]

  # NO INLINE SecurityGroupEgress/Ingress ON EITHER GROUP — each would
  # need to reference the other's id from inside its own Properties,
  # a genuine circular create-order dependency CloudFormation refuses
  # outright (cfn-lint E3004). Standard fix: create both groups
  # empty, then wire the cross-reference through two standalone rule
  # resources below, each of which can legitimately depend on both
  # groups already existing.
  EmbryonautFunctionSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref EmbryonautDbVpc
      GroupDescription: EmbryonautFunction - no inbound (Lambda receives no traffic via its VPC ENI), egress rule attached separately below

  EmbryonautDbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref EmbryonautDbVpc
      GroupDescription: EmbryonautDb - ingress rule attached separately below, from EmbryonautFunction only

  EmbryonautFunctionEgressToDb:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref EmbryonautFunctionSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      DestinationSecurityGroupId: !Ref EmbryonautDbSecurityGroup

  EmbryonautDbIngressFromFunction:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref EmbryonautDbSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref EmbryonautFunctionSecurityGroup

  EmbryonautDb:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: postgres
      EngineVersion: "16.14"
      DBInstanceClass: db.t4g.micro
      AllocatedStorage: "20"
      StorageEncrypted: true
      DBName: embryonaut
      MasterUsername: postgres
      ManageMasterUserPassword: true
      PubliclyAccessible: false
      DBSubnetGroupName: !Ref EmbryonautDbSubnetGroup
      VPCSecurityGroups: [!Ref EmbryonautDbSecurityGroup]

  EmbryonautFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      # PINNED, not SAM's own auto-suffixed default — a Ruby-side
      # LambdaClient needs to know this function's name AHEAD OF a
      # first deploy (there's no chicken-egg lookup step), the same
      # "configured for me, in the projection" standard every other
      # piece of generated deploy config already holds to. Matches
      # `stack_name` above exactly — one name, two places it's read
      # from, never out of sync since both derive from `domain_name`.
      FunctionName: hecksagain-embryonaut
      PackageType: Zip
      Runtime: provided.al2023
      Architectures: [arm64]
      Handler: bootstrap
      MemorySize: 512
      Timeout: 10
      Environment:
        Variables:
          # {{resolve:secretsmanager:...}} is a CloudFormation dynamic
          # reference — resolved by the platform at deploy time, never
          # rendered into the template, this tool's output, or any
          # CloudTrail/console view of the function's own config as
          # plaintext outside AWS's own encrypted handling.
          DATABASE_URL: !Sub
            - "postgres://postgres:${DbPass}@${DbHost}:5432/embryonaut"
            - DbPass: !Sub "{{resolve:secretsmanager:${EmbryonautDb.MasterUserSecret.SecretArn}:SecretString:password}}"
              DbHost: !GetAtt EmbryonautDb.Endpoint.Address
          HECKS_WASM_PATH: !Sub "/var/task/embryonaut.wasm"
          # STATIC, not a deploy-time parameter — HECKS_DOMAIN is this
          # domain's own declared name, known at generation time the
          # same way DBName/HECKS_WASM_PATH already are. HECKS_ERA is
          # "1" because that's what a FRESH database always gets:
          # Postgres::LineageManager::EraResolver#check! mints era 1
          # unconditionally the first time any Ruby process boots
          # against an empty `hecks_eras` (era_resolver.rb's own
          # `held.empty?` branch) — deterministic, not guessed. `make
          # mint-era` (this directory's own Makefile) is what actually
          # triggers that first boot; a LATER real schema evolution
          # (era 2+) is a separate, later re-generation, not this one.
          HECKS_DOMAIN: Embryonaut
          HECKS_ERA: "1"
      VpcConfig:
        SubnetIds: [!Ref EmbryonautDbSubnetA, !Ref EmbryonautDbSubnetB]
        SecurityGroupIds: [!Ref EmbryonautFunctionSecurityGroup]
      # AWS_IAM, not NONE — this dispatches real domain commands
      # (cap-table/governance-shaped data, for Embryonaut's own use);
      # an unauthenticated public URL is the wrong default for that,
      # even though it's the simpler one to demo with.
      FunctionUrlConfig:
        AuthType: AWS_IAM
  # THE WEB APP'S OWN LAMBDA — opt-in, see `web_handler_present` above.
  # VPC-attached for the SAME reason EmbryonautFunction is (Member's own
  # persistence needs the private RDS instance directly, permanently —
  # embryonaut.hecksagon's own comment on why), sharing
  # EmbryonautFunctionSecurityGroup rather than minting a second one, since
  # both need the identical egress-to-DB rule. That VPC attachment
  # ALSO cuts off the public internet by default (this stack's own "NO
  # NAT GATEWAY" design) — but this function has to reach
  # EmbryonautFunction itself via `lambda:InvokeFunction`, a public AWS API
  # call. WebFunctionLambdaEndpoint below is the targeted fix: a
  # VPC Interface Endpoint for the Lambda service ONLY (not a NAT
  # Gateway) — a few dollars a month, not a general internet route.
  EmbryonautDbLambdaEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref EmbryonautDbVpc
      # EC2's own GroupDescription character set excludes apostrophes
      # too, not just em-dashes -- "this stack's own" was a real,
      # live rejection ("Invalid security group description").
      GroupDescription: EmbryonautDbLambdaEndpoint - HTTPS from this stacks own Lambdas only
  
  EmbryonautDbLambdaEndpointIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref EmbryonautDbLambdaEndpointSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref EmbryonautFunctionSecurityGroup
  
  EmbryonautDbLambdaEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref EmbryonautDbVpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.lambda"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref EmbryonautDbSubnetA, !Ref EmbryonautDbSubnetB]
      SecurityGroupIds: [!Ref EmbryonautDbLambdaEndpointSecurityGroup]
  
  # Auto-generated, never typed or seen — the SAME
  # ManageMasterUserPassword pattern EmbryonautDb already uses for its own
  # password, applied to Sinatra's own session-signing secret instead.
  WebFunctionSessionSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: session_secret
        PasswordLength: 64
        ExcludePunctuation: true
  
  WebFunction:
    Type: AWS::Serverless::Function
    # NO Metadata.BuildMethod — "bundler" isn't a real SAM value (a
    # real, live UnsupportedBuilderException caught this); `Runtime:
    # ruby3.2` alone is enough for SAM to select its own built-in Ruby
    # bundler workflow automatically. EmbryonautFunction's own `BuildMethod:
    # makefile` above is different: rust/host isn't a runtime SAM
    # knows how to build at all, so it needs an explicit custom
    # workflow — this function doesn't.
    Properties:
      FunctionName: hecksagain-embryonaut-web
      Runtime: ruby3.2
      Architectures: [arm64]
      Handler: lambda_handler.lambda_handler
      CodeUri: /Users/christopheryoung/Projects/embryonaut
      MemorySize: 512
      Timeout: 15
      Environment:
        Variables:
          DOMAIN_ROOT: /var/task
          DOMAIN_NAME: Embryonaut
          HECKS_LAMBDA_ROUTING: "true"
          HECKS_LAMBDA_REGION: us-east-1
          # Member's own permanent Postgres connection — the SAME RDS
          # instance EmbryonautFunction itself writes rust/host's flat
          # journal into, different database engine role (Ruby's own
          # era/lineage schema, not rust/host's), never the real
          # Fly-hosted Postgres this whole effort is retiring away from.
          DATABASE_URL: !Sub
            - "postgres://postgres:${DbPass}@${DbHost}:5432/embryonaut"
            - DbPass: !Sub "{{resolve:secretsmanager:${EmbryonautDb.MasterUserSecret.SecretArn}:SecretString:password}}"
              DbHost: !GetAtt EmbryonautDb.Endpoint.Address
          SESSION_SECRET: !Sub "{{resolve:secretsmanager:${WebFunctionSessionSecret}:SecretString:session_secret}}"
          # GOOGLE_CLIENT_ID/GOOGLE_CLIENT_SECRET/GOOGLE_REDIRECT_URI
          # deliberately NOT set here — the real Fly deployment this
          # replaces never had them configured either (fly secrets
          # list -a embryonaut-founder-app: only DATABASE_URL and
          # SESSION_SECRET), matching production's own current reality
          # that nobody has signed in via Google yet. Add them as real
          # values once real OAuth credentials exist to configure.
      VpcConfig:
        SubnetIds: [!Ref EmbryonautDbSubnetA, !Ref EmbryonautDbSubnetB]
        SecurityGroupIds: [!Ref EmbryonautFunctionSecurityGroup]
      # NONE, not AWS_IAM — real users need to reach sign-in over
      # plain HTTPS, unlike EmbryonautFunction's own AWS_IAM-protected URL
      # (this function is the ONLY thing meant to call that one).
      FunctionUrlConfig:
        AuthType: NONE


Outputs:
  FunctionUrl:
    Value: !GetAtt EmbryonautFunctionUrl.FunctionUrl
  WebFunctionUrl:
    Value: !GetAtt WebFunctionUrl.FunctionUrl
  DatabaseEndpoint:
    Value: !GetAtt EmbryonautDb.Endpoint.Address
  DatabaseSecretArn:
    Value: !GetAtt EmbryonautDb.MasterUserSecret.SecretArn
  # THE 3 FACTS `make mint-era` NEEDS — this stack's own VPC and RDS
  # security group, so bastion.yaml (a separate, sibling stack,
  # created only for the few minutes a mint takes and destroyed
  # right after) can attach into the SAME private network without
  # this main template ever knowing a bastion exists. SubnetB, not
  # SubnetA — arbitrary but fixed, so every domain's bastion lands
  # in a single, predictable AZ.
  VpcId:
    Value: !Ref EmbryonautDbVpc
  PrivateSubnetId:
    Value: !Ref EmbryonautDbSubnetB
  DbSecurityGroupId:
    Value: !Ref EmbryonautDbSecurityGroup
