          HECKS_LAMBDA_ROUTING: "true"
          HECKS_LAMBDA_REGION: us-east-1
          HECKS_SCHEMA: embryonautfoundersapp
          # SAME setting /Users/christopheryoung/Projects/embryonautfoundersapp's own fly.toml/Dockerfile already
