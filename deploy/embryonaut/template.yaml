      # .../EmbryonautFunction/Makefile" when CodeUri named a
      # directory of its own). This project's one Makefile lives at
      # the deploy directory's own root, alongside this template --
      # "." is where it actually is.
      CodeUri: .
      PackageType: Zip
      Runtime: provided.al2023
      Architectures: [arm64]
      Handler: bootstrap
      MemorySize: 512
      Timeout: 10
      Environment:
        Variables:
          # {{resolve:secretsmanager:...}} is a CloudFormation dynamic
          # reference — resolved by the platform at deploy time, never
          # rendered into the template, this tool's output, or any
          # CloudTrail/console view of the function's own config as
          # plaintext outside AWS's own encrypted handling.
          DATABASE_URL: !Sub
            - "postgres://postgres:${DbPass}@${DbHost}:5432/embryonaut"
            - DbPass: !Sub "{{resolve:secretsmanager:${EmbryonautDb.MasterUserSecret.SecretArn}:SecretString:password}}"
              DbHost: !GetAtt EmbryonautDb.Endpoint.Address
          # `domain_name`, NOT `infra_name` — this names the actual
          # .wasm FILE bin/project_wasm writes (rust/dist/embryonautfoundersapp.wasm,
          # its own target_mod_name convention, a Rust-build-pipeline
          # concern unrelated to AWS resource identity) and what the
          # Makefile below actually bundles into the Lambda package
          # under. Confirmed the hard way: pinning this to infra_name
          # alongside the real AWS-identity fields left it looking for
