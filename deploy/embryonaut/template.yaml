# this file rather than hand-editing. Source: /Users/christopheryoung/Projects/embryonaut/bluebook/embryonaut.world's own
# deployed_to("AwsLambda") block.
#
# SELF-CONTAINED, ON PURPOSE — this stack owns its own private VPC,
# subnets, security groups, and RDS Postgres instance, not just the
# Lambda. No externally-supplied VPC/database parameters, no
# DatabaseUrl secret anyone has to type: RDS's own
# ManageMasterUserPassword generates and stores the password in
# Secrets Manager, and DATABASE_URL is composed from it via a
# CloudFormation dynamic reference — resolved at deploy time, never
# visible in this template, a parameter, or any tool's output.
#
# NO NAT GATEWAY — deliberately. These subnets have no route to the
# internet at all, only to the RDS instance inside the same VPC. That's
# the whole job today (dispatch a command, read/write the journal);
# CloudWatch Logs delivery doesn't go through the function's own VPC
# networking, so it needs no route either. Real outbound internet
# access from here (a future external API call, say) would need a NAT
# Gateway added — a real, ongoing cost this template doesn't take on
# until something actually needs it.
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  embryonaut — dispatched through hecksagain's rust/host, a
  wasmtime-sandboxed Rust binary with a rehydrate-and-replay Postgres
  journal (docs/decisions/0018), backed by its own private RDS
  Postgres instance. PackageType Zip, no container.

Resources:
  EmbryonautDbVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true

  EmbryonautDbSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref EmbryonautDbVpc
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']

  EmbryonautDbSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref EmbryonautDbVpc
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']

  EmbryonautDbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub "${AWS::StackName} - private subnets for embryonaut's own RDS instance"
      SubnetIds: [!Ref EmbryonautDbSubnetA, !Ref EmbryonautDbSubnetB]

  # NO INLINE SecurityGroupEgress/Ingress ON EITHER GROUP — each would
  # need to reference the other's id from inside its own Properties,
  # a genuine circular create-order dependency CloudFormation refuses
  # outright (cfn-lint E3004). Standard fix: create both groups
  # empty, then wire the cross-reference through two standalone rule
  # resources below, each of which can legitimately depend on both
  # groups already existing.
  EmbryonautFunctionSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref EmbryonautDbVpc
      GroupDescription: EmbryonautFunction - no inbound (Lambda receives no traffic via its VPC ENI), egress rule attached separately below

  EmbryonautDbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref EmbryonautDbVpc
      GroupDescription: EmbryonautDb - ingress rule attached separately below, from EmbryonautFunction only

  EmbryonautFunctionEgressToDb:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref EmbryonautFunctionSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      DestinationSecurityGroupId: !Ref EmbryonautDbSecurityGroup

  EmbryonautDbIngressFromFunction:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref EmbryonautDbSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref EmbryonautFunctionSecurityGroup

  EmbryonautDb:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: postgres
      EngineVersion: "16.14"
      DBInstanceClass: db.t4g.micro
      AllocatedStorage: "20"
      StorageEncrypted: true
      DBName: embryonaut
      MasterUsername: postgres
      ManageMasterUserPassword: true
      PubliclyAccessible: false
      DBSubnetGroupName: !Ref EmbryonautDbSubnetGroup
      VPCSecurityGroups: [!Ref EmbryonautDbSecurityGroup]

  EmbryonautFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      PackageType: Zip
      Runtime: provided.al2023
      Architectures: [arm64]
      Handler: bootstrap
      MemorySize: 512
      Timeout: 10
      Environment:
        Variables:
          # {{resolve:secretsmanager:...}} is a CloudFormation dynamic
          # reference — resolved by the platform at deploy time, never
          # rendered into the template, this tool's output, or any
          # CloudTrail/console view of the function's own config as
          # plaintext outside AWS's own encrypted handling.
          DATABASE_URL: !Sub
            - "postgres://postgres:${DbPass}@${DbHost}:5432/embryonaut"
            - DbPass: !Sub "{{resolve:secretsmanager:${EmbryonautDb.MasterUserSecret.SecretArn}:SecretString:password}}"
              DbHost: !GetAtt EmbryonautDb.Endpoint.Address
          HECKS_WASM_PATH: !Sub "/var/task/embryonaut.wasm"
      VpcConfig:
        SubnetIds: [!Ref EmbryonautDbSubnetA, !Ref EmbryonautDbSubnetB]
        SecurityGroupIds: [!Ref EmbryonautFunctionSecurityGroup]
      # AWS_IAM, not NONE — this dispatches real domain commands
      # (cap-table/governance-shaped data, for Embryonaut's own use);
      # an unauthenticated public URL is the wrong default for that,
      # even though it's the simpler one to demo with.
      FunctionUrlConfig:
        AuthType: AWS_IAM

Outputs:
  FunctionUrl:
    Value: !GetAtt EmbryonautFunctionUrl.FunctionUrl
  DatabaseEndpoint:
    Value: !GetAtt EmbryonautDb.Endpoint.Address
  DatabaseSecretArn:
    Value: !GetAtt EmbryonautDb.MasterUserSecret.SecretArn
