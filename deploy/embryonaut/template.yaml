AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  embryonaut — dispatched through hecks's rust/host, a
  wasmtime-sandboxed Rust binary with a rehydrate-and-replay Postgres
  journal (docs/decisions/0018), backed by its own private RDS
  Postgres instance. PackageType Zip, no container.
Parameters:
  # Lambda Function URLs get a random, un-derivable hostname at
  # creation -- WebFunction's own GOOGLE_REDIRECT_URI can't
  # reference `!GetAtt WebFunctionUrl.FunctionUrl` from inside
  # WebFunction's OWN Environment (that's a real circular
  # dependency CloudFormation rejects: the value doesn't exist until
  # the function+URL do). Resolved OUTSIDE the stack instead --
  # `make deploy`'s own recipe looks up the CURRENTLY deployed
  # Function URL (empty on a true first deploy, before the URL
  # exists at all) and passes it as `--parameter-overrides`; every
  # deploy after the first self-heals this correctly.
  WebRedirectBaseUrl:
    Type: String
    Default: ""

Resources:
  EmbryonautDbVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
  
  EmbryonautDbSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref EmbryonautDbVpc
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
  
  EmbryonautDbSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref EmbryonautDbVpc
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
  
  # WebFunction's own real Google OAuth token exchange needs
  # real internet access -- see template.yaml's own "NO NAT GATEWAY"
  # comment, above, for why. One NAT Gateway, one public subnet,
  # opt-in on the same google_oauth_present signal that wires
  # GOOGLE_CLIENT_ID/SECRET -- nothing else in this stack pays for it.
  EmbryonautDbPublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref EmbryonautDbVpc
      CidrBlock: 10.0.3.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
  
  EmbryonautDbInternetGateway:
    Type: AWS::EC2::InternetGateway
  
  EmbryonautDbInternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref EmbryonautDbVpc
      InternetGatewayId: !Ref EmbryonautDbInternetGateway
  
  EmbryonautDbPublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref EmbryonautDbVpc
  
  EmbryonautDbPublicRoute:
    Type: AWS::EC2::Route
    DependsOn: EmbryonautDbInternetGatewayAttachment
    Properties:
      RouteTableId: !Ref EmbryonautDbPublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref EmbryonautDbInternetGateway
  
  EmbryonautDbPublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref EmbryonautDbPublicSubnet
      RouteTableId: !Ref EmbryonautDbPublicRouteTable
  
  # A SECOND public subnet, AZ index 1 -- NOT where NatGateway lives
  # (that's still EmbryonautDbPublicSubnet, AZ index 0, unaffected: NAT
  # Gateways aren't EC2 instances and were never the problem). Only
  # for bastion.yaml's own BastionInstance, a real EC2 instance that
  # a real, live CREATE_FAILED proved this account can't launch in AZ
  # index 0 at all -- see BastionSubnetId's own STACK_OUTPUTS comment.
  # Same shared EmbryonautDbPublicRouteTable/EmbryonautDbInternetGateway as
  # EmbryonautDbPublicSubnet, not a second IGW -- a VPC accepts only ONE.
  EmbryonautDbBastionPublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref EmbryonautDbVpc
      CidrBlock: 10.0.4.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: true
  
  EmbryonautDbBastionPublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref EmbryonautDbBastionPublicSubnet
      RouteTableId: !Ref EmbryonautDbPublicRouteTable
  
  EmbryonautDbNatEip:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
  
  EmbryonautDbNatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      SubnetId: !Ref EmbryonautDbPublicSubnet
      AllocationId: !GetAtt EmbryonautDbNatEip.AllocationId
  
  # EmbryonautDbSubnetA/B (PRIVATE — Lambda/RDS live here) had no
  # explicit route table before this, only the VPC's own implicit
  # default (local-only, no 0.0.0.0/0 route at all — the ENTIRE
  # point of "no NAT Gateway" until now). Needs one now, routing
  # outbound through EmbryonautDbNatGateway instead of an Internet
  # Gateway directly — the whole reason a NAT (not just an IGW)
  # exists: outbound-only, no inbound path back into these subnets.
  EmbryonautDbPrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref EmbryonautDbVpc
  
  EmbryonautDbPrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref EmbryonautDbPrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref EmbryonautDbNatGateway
  
  EmbryonautDbSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref EmbryonautDbSubnetA
      RouteTableId: !Ref EmbryonautDbPrivateRouteTable
  
  EmbryonautDbSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref EmbryonautDbSubnetB
      RouteTableId: !Ref EmbryonautDbPrivateRouteTable
  EmbryonautDbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub "${AWS::StackName} - private subnets for embryonaut's own RDS instance"
      SubnetIds: [!Ref EmbryonautDbSubnetA, !Ref EmbryonautDbSubnetB]
  
  # NO INLINE SecurityGroupEgress/Ingress ON EITHER GROUP — each would
  # need to reference the other's id from inside its own Properties,
  # a genuine circular create-order dependency CloudFormation refuses
  # outright (cfn-lint E3004). Standard fix: create both groups
  # empty, then wire the cross-reference through two standalone rule
  # resources below, each of which can legitimately depend on both
  # groups already existing.
  EmbryonautFunctionSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref EmbryonautDbVpc
      GroupDescription: EmbryonautFunction - no inbound (Lambda receives no traffic via its VPC ENI), egress rule attached separately below
  
  EmbryonautDbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref EmbryonautDbVpc
      GroupDescription: EmbryonautDb - ingress rule attached separately below, from EmbryonautFunction only
  
  EmbryonautFunctionEgressToDb:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref EmbryonautFunctionSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      DestinationSecurityGroupId: !Ref EmbryonautDbSecurityGroup
  
  # A standalone AWS::EC2::SecurityGroupEgress resource for a group
  # REPLACES that group's own default allow-all-outbound rule with
  # ONLY what's explicitly declared here -- EmbryonautFunctionEgressToDb's
  # own existence already means EmbryonautFunctionSecurityGroup has NO
  # other egress at all, confirmed live (`aws ec2
  # describe-security-groups`): every real Google OAuth token-
  # exchange POST got silently dropped at the SG, not routing, even
  # with EmbryonautDbNatGateway fully wired -- the exact-15-second Lambda
  # timeout (not a DNS/route error) was the giveaway. 443 to
  # 0.0.0.0/0, not a narrower destination -- Google publishes no
  # fixed IP range for oauth2.googleapis.com an AWS security group
  # could reference instead.
  EmbryonautFunctionEgressToInternet:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref EmbryonautFunctionSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      CidrIp: 0.0.0.0/0
  EmbryonautDbIngressFromFunction:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref EmbryonautDbSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref EmbryonautFunctionSecurityGroup
  
  EmbryonautDb:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: postgres
      EngineVersion: "16.14"
      DBInstanceClass: db.t4g.micro
      AllocatedStorage: "20"
      StorageEncrypted: true
      DBName: embryonaut
      MasterUsername: postgres
      ManageMasterUserPassword: true
      PubliclyAccessible: false
      DBSubnetGroupName: !Ref EmbryonautDbSubnetGroup
      VPCSecurityGroups: [!Ref EmbryonautDbSecurityGroup]

  
  EmbryonautFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      # PINNED, not SAM's own auto-suffixed default — a Ruby-side
      # LambdaClient needs to know this function's name AHEAD OF a
      # first deploy (there's no chicken-egg lookup step), the same
      # "configured for me, in the projection" standard every other
      # piece of generated deploy config already holds to. Matches
      # `stack_name` above exactly — one name, two places it's read
      # from, never out of sync since both derive from `infra_name`.
      FunctionName: hecks-embryonaut
      # EXPLICIT, not omitted -- `sam build EmbryonautFunction` and
      # `sam build --use-container WebFunction` run as TWO SEPARATE
      # single-resource invocations (deploy:'s own comment on why:
      # cargo-lambda cross-compiles on this host directly, pg's
      # native extension needs the container -- `--use-container` is
      # a global sam build flag, can't be scoped per-resource). Each
      # invocation regenerates .aws-sam/build/template.yaml from
      # THIS source template for every resource, not just the one it
      # builds -- a resource with no CodeUri here reverts to
      # CodeUri-less after the SECOND invocation, and `sam deploy`
      # then defaults a missing CodeUri to the template's own
      # containing directory (deploy/embryonaut/ itself),
      # zipping the whole project tree -- including WebFunction's
      # own source -- as this function's code. A real, live deploy
      # shipped exactly that broken artifact (confirmed via
      # `aws lambda get-function` + downloading the actual deployed
      # zip). Pinning CodeUri here survives that regeneration: it
      # still resolves to `.aws-sam/build/EmbryonautFunction/`, where
      # build-EmbryonautFunction's own `cp ... $(ARTIFACTS_DIR)` already
      # placed the real bootstrap+wasm, regardless of which of the
      # two sam build calls ran most recently.
      # "." NOT "EmbryonautFunction" -- SAM's Makefile build workflow
      # requires the Makefile to live INSIDE CodeUri itself
