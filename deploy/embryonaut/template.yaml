      Runtime: ruby3.2
      Architectures: [arm64]
      # THREE parts (file.Class.method), not two — aws-lambda-ric's own
      # 2-part form calls a plain TOP-LEVEL function via __send__, not
      # a module method; /Users/christopheryoung/Projects/embryonautfoundersapp/lambda_handler.rb's own comment on
