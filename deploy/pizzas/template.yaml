# GENERATED by bin/project_deploy /Users/christopheryoung/Projects/pizzas — re-run it to refresh
# this file rather than hand-editing. Source: /Users/christopheryoung/Projects/pizzas/bluebook/pizzas.world's own
# deployed_to("AwsLambda") block.
#
# SELF-CONTAINED, ON PURPOSE — this stack owns its own private VPC,
# subnets, security groups, and RDS Postgres instance, not just the
# Lambda. No externally-supplied VPC/database parameters, no
# DatabaseUrl secret anyone has to type: RDS's own
# ManageMasterUserPassword generates and stores the password in
# Secrets Manager, and DATABASE_URL is composed from it via a
# CloudFormation dynamic reference — resolved at deploy time, never
# visible in this template, a parameter, or any tool's output.
#
# NO NAT GATEWAY for PizzasFunction — deliberately. Its own subnets
# have no route to the internet at all, only to the RDS instance
# inside the same VPC: dispatch a command, read/write the journal.
# CloudWatch Logs delivery doesn't go through the function's own VPC
# networking, so it needs no route either.
  # Real outbound internet access from here (a future external API
  # call, say) would need a NAT Gateway added -- a real, ongoing cost
  # this template doesn't take on until something actually needs it.
AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  pizzas — dispatched through hecksagain's rust/host, a
  wasmtime-sandboxed Rust binary with a rehydrate-and-replay Postgres
  journal (docs/decisions/0018), backed by its own private RDS
  Postgres instance. PackageType Zip, no container.

Resources:
  PizzasDbVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true

  PizzasDbSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref PizzasDbVpc
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']

  PizzasDbSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref PizzasDbVpc
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']

  
  PizzasDbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub "${AWS::StackName} - private subnets for pizzas's own RDS instance"
      SubnetIds: [!Ref PizzasDbSubnetA, !Ref PizzasDbSubnetB]

  # NO INLINE SecurityGroupEgress/Ingress ON EITHER GROUP — each would
  # need to reference the other's id from inside its own Properties,
  # a genuine circular create-order dependency CloudFormation refuses
  # outright (cfn-lint E3004). Standard fix: create both groups
  # empty, then wire the cross-reference through two standalone rule
  # resources below, each of which can legitimately depend on both
  # groups already existing.
  PizzasFunctionSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref PizzasDbVpc
      GroupDescription: PizzasFunction - no inbound (Lambda receives no traffic via its VPC ENI), egress rule attached separately below

  PizzasDbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId: !Ref PizzasDbVpc
      GroupDescription: PizzasDb - ingress rule attached separately below, from PizzasFunction only

  PizzasFunctionEgressToDb:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref PizzasFunctionSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      DestinationSecurityGroupId: !Ref PizzasDbSecurityGroup

  
  PizzasDbIngressFromFunction:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref PizzasDbSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref PizzasFunctionSecurityGroup

  # Aurora Serverless v2, Postgres-compatible -- the split shape
  # Aurora needs (a DBCluster carrying the managed password/
  # endpoint/subnet-group/security-group, plus at least one
  # DBInstance inside it) is the ONLY thing different from the
  # plain-RDS path below; Adapters::Postgres/tokio_postgres speak
  # the identical wire protocol against either endpoint.
  # SELF-MANAGED, not ManageMasterUserPassword: true -- confirmed
  # live that the plain-RDS path's own approach (below) has a real
  # staleness bug for a Lambda's own Environment: CloudFormation's
  # `{{resolve:secretsmanager:...}}` only resolves an AUTO-ROTATING
  # managed secret fresh at the Function resource's OWN creation;
  # RDS's managed-password feature rotates the password itself
  # shortly after standing up the cluster (confirmed: the FIRST
  # resolved password stopped authenticating within minutes), and
  # neither a Code-only update NOR a later `sam deploy` re-resolved
  # it -- every subsequent invocation kept authenticating with the
  # now-stale original value, a real "password authentication
  # failed" caught live. A self-managed secret (generated once,
  # here, never auto-rotated) has nothing to go stale: the same
  # resolved value stays correct for as long as this stack exists.
  # Scoped to the Aurora path alone -- the plain-RDS path below is
  # Embryonaut's own already-live, proven arrangement, untouched.
  PizzasDbSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      GenerateSecretString:
        SecretStringTemplate: '{"username":"postgres"}'
        GenerateStringKey: password
        PasswordLength: 32
        # Nothing here NEEDS excluding purely for correctness
        # anymore (rust/host's own parse_database_url never
        # URI-parses the password segment), but keeping the
        # generated password free of quote/at-sign/slash is
        # still the more legible default for anyone pasting
        # DATABASE_URL by hand while debugging. Deliberately NOT
        # excluding backslash/apostrophe too, to sidestep YAML's
        # own nested-quote escaping inside this string entirely
        # (real, live "found character '@' that cannot start any
        # token" caught the FIRST attempt at that).
        ExcludeCharacters: '"@/'
  
  PizzasDbCluster:
    Type: AWS::RDS::DBCluster
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    # Explicit, not left implicit -- MasterUserPassword's own
    # dynamic reference below doesn't create one on its own (see
    # PizzasFunction's own comment on this same fact).
    DependsOn: PizzasDbSecret
    Properties:
      Engine: aurora-postgresql
      # Matches the plain-RDS path's own EngineVersion exactly
      # (below) — confirmed real and Serverless-v2-capable via
      # `aws rds describe-db-engine-versions --engine
      # aurora-postgresql --engine-version 16.14`
      # (ServerlessV2FeaturesSupport: 0.0-256.0), unlike the
      # first guess here ("16.6" -- a real, live "Cannot find
      # version 16.6 for aurora-postgresql" caught this).
      EngineVersion: "16.14"
      DatabaseName: pizzas
      MasterUsername: postgres
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${PizzasDbSecret}:SecretString:password}}"
      StorageEncrypted: true
      DBSubnetGroupName: !Ref PizzasDbSubnetGroup
      VpcSecurityGroupIds: [!Ref PizzasDbSecurityGroup]
      ServerlessV2ScalingConfiguration:
        MinCapacity: 0.5
        MaxCapacity: 1
  
  PizzasDbInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: aurora-postgresql
      DBInstanceClass: db.serverless
      DBClusterIdentifier: !Ref PizzasDbCluster
      PubliclyAccessible: false

  PizzasFunction:
    Type: AWS::Serverless::Function
    # `{{resolve:secretsmanager:...}}` dynamic references do NOT
    # create an implicit CloudFormation dependency on the referenced
    # resource (documented AWS behavior) -- PizzasFunction's own
    # Environment resolves one against PizzasDbSecret below. A plain
    # `DependsOn: PizzasDbSecret` alone (CREATE_COMPLETE before this
    # resource's own update starts) still hit a real, live, repeatable
    # "Secrets Manager can't find the specified secret
    # (ResourceNotFoundException)" -- CREATE_COMPLETE from
    # CloudFormation's own perspective doesn't guarantee the secret is
    # yet READABLE via a dynamic reference from a DIFFERENT resource's
    # own concurrent update (AWS-side eventual consistency, not a
    # CloudFormation ordering bug `DependsOn` alone can close).
    # Chaining through PizzasDbCluster too -- which ALSO reads this
    # secret, and whose own RDS-side update takes real, substantial
    # wall-clock time to apply -- gives that propagation window time
    # to close before PizzasFunction's own resolution is attempted.
    DependsOn: [PizzasDbSecret, PizzasDbCluster]
    Metadata:
      BuildMethod: makefile
    Properties:
      # PINNED, not SAM's own auto-suffixed default — a Ruby-side
      # LambdaClient needs to know this function's name AHEAD OF a
      # first deploy (there's no chicken-egg lookup step), the same
      # "configured for me, in the projection" standard every other
      # piece of generated deploy config already holds to. Matches
      # `stack_name` above exactly — one name, two places it's read
      # from, never out of sync since both derive from `domain_name`.
      FunctionName: hecksagain-pizzas
      # EXPLICIT, not omitted -- `sam build EmbryonautFunction` and
      # `sam build --use-container WebFunction` run as TWO SEPARATE
      # single-resource invocations (deploy:'s own comment on why:
      # cargo-lambda cross-compiles on this host directly, pg's
      # native extension needs the container -- `--use-container` is
      # a global sam build flag, can't be scoped per-resource). Each
      # invocation regenerates .aws-sam/build/template.yaml from
      # THIS source template for every resource, not just the one it
      # builds -- a resource with no CodeUri here reverts to
      # CodeUri-less after the SECOND invocation, and `sam deploy`
      # then defaults a missing CodeUri to the template's own
      # containing directory (deploy/pizzas/ itself),
      # zipping the whole project tree -- including WebFunction's
      # own source -- as this function's code. A real, live deploy
      # shipped exactly that broken artifact (confirmed via
      # `aws lambda get-function` + downloading the actual deployed
      # zip). Pinning CodeUri here survives that regeneration: it
      # still resolves to `.aws-sam/build/PizzasFunction/`, where
      # build-PizzasFunction's own `cp ... $(ARTIFACTS_DIR)` already
      # placed the real bootstrap+wasm, regardless of which of the
      # two sam build calls ran most recently.
      # "." NOT "PizzasFunction" -- SAM's Makefile build workflow
      # requires the Makefile to live INSIDE CodeUri itself
      # (confirmed live: "Makefile not found at
      # .../EmbryonautFunction/Makefile" when CodeUri named a
      # directory of its own). This project's one Makefile lives at
      # the deploy directory's own root, alongside this template --
      # "." is where it actually is.
      CodeUri: .
      PackageType: Zip
      Runtime: provided.al2023
      Architectures: [arm64]
      Handler: bootstrap
      MemorySize: 512
      Timeout: 10
      Environment:
        Variables:
          # {{resolve:secretsmanager:...}} is a CloudFormation dynamic
          # reference — resolved by the platform at deploy time, never
          # rendered into the template, this tool's output, or any
          # CloudTrail/console view of the function's own config as
          # plaintext outside AWS's own encrypted handling.
          DATABASE_URL: !Sub
            - "postgres://postgres:${DbPass}@${DbHost}:5432/pizzas"
            - DbPass: !Sub "{{resolve:secretsmanager:${PizzasDbSecret}:SecretString:password}}"
              DbHost: !GetAtt PizzasDbCluster.Endpoint.Address
          HECKS_WASM_PATH: !Sub "/var/task/pizzas.wasm"
          # STATIC, not a deploy-time parameter — HECKS_DOMAIN is this
          # domain's own declared name, known at generation time the
          # same way DBName/HECKS_WASM_PATH already are. HECKS_ERA is
          # "1" because that's what a FRESH database always gets:
          # Postgres::LineageManager::EraResolver#check! mints era 1
          # unconditionally the first time any Ruby process boots
          # against an empty `hecks_eras` (era_resolver.rb's own
          # `held.empty?` branch) — deterministic, not guessed. `make
          # mint-era` (this directory's own Makefile) is what actually
          # triggers that first boot; a LATER real schema evolution
          # (era 2+) is a separate, later re-generation, not this one.
          HECKS_DOMAIN: Pizzas
          HECKS_ERA: "1"
          HECKS_IR_PATH: !Sub "/var/task/pizzas.ir.json"
      VpcConfig:
        SubnetIds: [!Ref PizzasDbSubnetA, !Ref PizzasDbSubnetB]
        SecurityGroupIds: [!Ref PizzasFunctionSecurityGroup]
      # AWS_IAM by default — this dispatches real domain commands
      # (cap-table/governance-shaped data, for Embryonaut's own use);
      # an unauthenticated public URL is the wrong default for that,
      # even though it's the simpler one to demo with. NONE only when
      # `web "Rust"` (rust/host/src/web.rs) makes this the public web
      # UI itself — safe even though the SAME Function URL also
      # carries the internal {"verb"}/{"read"} dispatch shapes,
      # because a Function-URL HTTP event can never be crafted into
      # that raw top-level shape (Function URLs always wrap the real
      # HTTP body inside requestContext.http/rawPath/event.body,
      # unconditionally); that raw shape is reachable only through
      # the AWS SDK's own IAM-authenticated Invoke API, which never
      # goes through a Function URL at all.
      FunctionUrlConfig:
        AuthType: NONE


Outputs:
  FunctionUrl:
    Value: !GetAtt PizzasFunctionUrl.FunctionUrl
  # STACK_OUTPUTS (bin/project_deploy, above the heredocs) is the ONE
  # place these four names live — DatabaseEndpoint/DatabaseSecretArn
  # feed `make mint-era`'s own boot step directly; VpcId/
  # DbSecurityGroupId ALSO feed bastion.yaml's own Parameters (a
  # separate, sibling stack, created only for the few minutes a mint
  # takes and destroyed right after, attaching into the SAME private
  # network without this main template ever knowing a bastion
  # exists) and the Makefile's own --parameter-overrides. Rename a
  # key in that table and every consumer follows; reference one that
  # doesn't exist there and bin/project_deploy refuses before
  # writing a single file, instead of a bastion.yaml whose Parameter
  # nothing could ever fill. (`PrivateSubnetId` used to sit here too
  # — dropped, nothing ever consumed it; bastion.yaml mints its own
  # subnet instead.)
  VpcId:
    Value: !Ref PizzasDbVpc
  DbSecurityGroupId:
    Value: !Ref PizzasDbSecurityGroup
  DatabaseEndpoint:
    Value: !GetAtt PizzasDbCluster.Endpoint.Address
  DatabaseSecretArn:
    Value: !Ref PizzasDbSecret
